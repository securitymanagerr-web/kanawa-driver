name: kanawa_driver
description: "KANAWA - App Motorista (Angola)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI e Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.14
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # HTTP e Storage
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Localização e Mapas
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.9.0

  # Utilitários
  intl: ^0.19.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0

  # Ícones
  cupertino_icons: ^1.0.8

  # 🔔 Notificações locais (som + vibração)
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/